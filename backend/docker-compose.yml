name: gdsc-sharing-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: gdsc-sharing-platform-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gdsc_sharing_platform}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    container_name: gdsc-sharing-platform-api
    restart: unless-stopped

    build:
      context: .
      dockerfile: src/GdscSharingPlatform.Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    depends_on:
      postgres:
        condition: service_healthy
        restart: true

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB:-gdsc_sharing_platform};
        Username=${POSTGRES_USER:-admin};
        Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}

      SeedAdmin__Enabled: ${SEED_ADMIN_ENABLED:-true}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@gdsc.dev}
      SeedAdmin__FullName: ${SEED_ADMIN_FULL_NAME:-System Administrator}
      SeedAdmin__DisplayName: ${SEED_ADMIN_DISPLAY_NAME:-System Administrator}
      SeedAdmin__DepartmentCode: ${SEED_ADMIN_DEPARTMENT_CODE:-MANAGEMENT}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-AdminPassword@123!}
      SeedAdmin__PhoneNumber: ${SEED_ADMIN_PHONE:-0901234567}
      SeedAdmin__StudentCode: ${SEED_ADMIN_STUDENT_CODE:-ADMIN001}
      SeedAdmin__GithubUrl: ${SEED_ADMIN_GITHUB:-https://github.com/gdsc-admin}
      SeedAdmin__Bio: ${SEED_ADMIN_BIO:-System Administrator of GDSC Sharing Platform}
      SeedAdmin__GenerationNumber: ${SEED_ADMIN_GENERATION:-8}
      SeedAdmin__RoleCode: ${SEED_ADMIN_ROLE_CODE:-LEAD}

      SeedMember__Enabled: ${SEED_MEMBER_ENABLED:-false}
      SeedMember__Email: ${SEED_MEMBER_EMAIL:-member@gdsc.dev}
      SeedMember__Password: ${SEED_MEMBER_PASSWORD:-MemberPassword@123!}
      SeedMember__FullName: ${SEED_MEMBER_FULL_NAME:-Club Member}
      SeedMember__DisplayName: ${SEED_MEMBER_DISPLAY_NAME:-Club Member}
      SeedMember__DepartmentCode: ${SEED_MEMBER_DEPARTMENT_CODE:-SOFTWARE}
      SeedMember__PhoneNumber: ${SEED_MEMBER_PHONE:-0901234568}
      SeedMember__StudentCode: ${SEED_MEMBER_STUDENT_CODE:-MEM001}
      SeedMember__GithubUrl: ${SEED_MEMBER_GITHUB:-https://github.com/gdsc-dev}
      SeedMember__Bio: ${SEED_MEMBER_BIO:-Software Team Member}
      SeedMember__GenerationNumber: ${SEED_MEMBER_GENERATION:-8}
      SeedMember__RoleCode: ${SEED_MEMBER_ROLE_CODE:-CORETEAM}


      Jwt__Issuer: ${JWT_ISSUER:-GdscSharingPlatform.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-GdscSharingPlatform.Web}
      Jwt__SecretKey: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Jwt__ClockSkewSeconds: ${JWT_CLOCK_SKEW_SECONDS:-0}

      Cors__AllowedOrigins__0: http://localhost:3000

    ports:
      - "${API_PORT:-8080}:8080"

    volumes:
      - api_uploads:/app/wwwroot/uploads

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  api_uploads:
